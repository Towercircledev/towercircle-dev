# /etc/nginx/sites-available/towercircle  (then: ln -s ../sites-available/towercircle /etc/nginx/sites-enabled/)

# Drop requests for any other host name (stops forged Host headers reaching the app).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name towercircle.in www.towercircle.in new.towercircle.in;
    root /var/www/towercircle/public;
    index index.php;
    charset utf-8;
    gzip on;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;
    client_max_body_size 8m;
    server_tokens off;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }

    location ~* \.(?:css|js|woff|woff2|png|jpg|jpeg|webp|svg|ico)$ {
        expires 365d;
        add_header Cache-Control "public, immutable";
        try_files $uri /index.php?$query_string;
    }

    # Only Laravel's front controller runs PHP. Any other .php file (including in uploads) is never executed.
    location ~ \.php$ { return 404; }
    location = /index.php {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Never serve hidden files (.env, .git) or anything outside /public
    location ~ /\.(?!well-known).* { deny all; }
}
